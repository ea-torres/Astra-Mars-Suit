<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astra Mars Suit · Helmet view</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Astra Mars Suit · Helmet view</h1>
  <p>What Alex, our model astronaut, sees on Mars through the visor, with HoloConnect AI’s augmented reality. Drag to look around.</p>
</header>

<div id="stage" tabindex="0" role="application" aria-label="Astronaut view on Mars. Drag or use the left and right arrow keys to turn your head.">
  <canvas id="c"></canvas>
  <div id="ar"></div>
  <div class="glare"></div>
  <div class="frame"></div>
  <div id="hud">
    <div id="tape"></div><div id="hdg"></div>
    <div class="col">
      <div class="pl" id="vit"></div>
      <div class="pl ai" id="al" aria-live="polite"></div>
    </div>
    <div class="pl right">
      <div class="bar">Oxygen <b id="o2v"></b><i><span id="o2b"></span></i></div>
      <div class="bar">Power <b id="pwv"></b><i><span id="pwb"></span></i></div>
      <div>Left <b id="tr"></b> h</div>
      <small id="lat" style="color:#8fd3c9"></small>
    </div>
    <div id="doc">
      <svg viewBox="0 0 120 130" aria-hidden="true"><g fill="none" stroke="#5fe3d0" stroke-width="2"><circle cx="60" cy="38" r="24"/><path d="M14 126c0-30 20-46 46-46s46 16 46 46z"/><path d="M40 82l20 20 20-20" opacity=".6"/></g><g stroke="#5fe3d0" opacity=".35"><path d="M10 20h100M10 40h100M10 60h100M10 80h100M10 100h100"/></g></svg>
      <div id="doctxt"></div>
    </div>
    <svg id="holo" viewBox="0 0 200 190" aria-hidden="true"><g id="hbase"></g><g id="hov"></g><rect class="scan" x="40" y="0" width="120" height="3" fill="#5fe3d0" opacity=".6"/></svg>
  </div>
  <div id="boot">HoloConnect AI · calibrating visor…</div>
</div>

<div class="ctl">
  <div class="sc" role="group" aria-label="Simulate scenario">
    <button data-s="nominal" class="sel">1 · Normal</button>
    <button data-s="gluc">2 · Low glucose</button>
    <button data-s="crit">3 · Unresponsive</button>
    <button data-s="alerts">Lactate + H₂O₂ alerts</button>
    <button data-s="dust">Dust storm</button>
  </div>
  <button id="artog" aria-pressed="true">Augmented reality: on</button>
  <label>EVA time <input id="t" type="range" min="0" max="480" value="0"> <b id="tt">T+0:00</b></label>
</div>

<p class="note">Design concept.</p>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
